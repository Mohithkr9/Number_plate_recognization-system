<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-container">
    <h2>Register</h2>
    <input type="text" id="registerName" placeholder="Full Name">
    <input type="email" id="registerEmail" placeholder="Email">
    <input type="tel" id="registerPhone" placeholder="Phone Number">
    <input type="text" id="registerVehicleModel" placeholder="Vehicle Model">
    <input type="text" id="registerVehicleNumber" placeholder="Vehicle Number">
    <input type="password" id="registerPassword" placeholder="Password">
    <button onclick="register()">Register</button>
    <p>Already have an account? <a href="login.html">Login</a></p>
  </div>
  <script type="module" src="auth.js"></script>
</body>
</html>
