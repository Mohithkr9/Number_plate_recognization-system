<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <h1>Parking Dashboard</h1>
    <div>
      <button onclick="window.location.href='profile.html'">Profile</button>
      <button onclick="window.location.href='history.html'">History</button>
      <button onclick="logout()">Logout</button>
    </div>
  </nav>

  <h2 class="center">Nearest Available Slot: <span id="nearestSlot">Checking...</span></h2>

  <div class="location-selector">
    <label for="locationDropdown">Select Parking Location:</label>
    <select id="locationDropdown" onchange="changeLocation()">
      <option value="">Loading locations...</option>
    </select>
    <div id="locationDetails" style="display: none; margin-top: 10px; padding: 10px; background: #f0f0f0; border-radius: 5px;">
      <p><strong>Address:</strong> <span id="locationAddress"></span></p>
      <p><strong>Rate:</strong> <span id="locationRate"></span>/hour</p>
      <p><strong>Hours:</strong> <span id="locationHours"></span></p>
    </div>
  </div>

  <div class="map-actions">
    <button onclick="searchNearbySlots()">Search Nearby Parking</button>
    <span class="map-hint">Use live location to find the closest available slot.</span>
  </div>

  <div id="parkingMap"></div>

  <div class="parking-grid" id="slotContainer">
    <p class="center">Select a location to view available slots.</p>
  </div>

  <script type="module" src="script.js"></script>
  <script type="module" src="auth.js"></script>
 <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    // Check if user is logged in
    if (!localStorage.getItem("currentUser")) {
      window.location.href = "login.html";
    }
  </script>
</body>
</html>
